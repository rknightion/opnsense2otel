name: publish
on:
  workflow_call:
    inputs:
      release_tag: { required: false, type: string, default: "" }
  workflow_dispatch:
    inputs:
      release_tag: { description: "vX.Y.Z; empty = edge :main test", required: false, type: string, default: "" }
permissions:
  contents: read
jobs:
  # Resolves the pinned go-licenses version/module out of the justfile (the one source
  # of truth, #436) so the release image build below installs the SAME tool the
  # `notices` job (and ci.yml's docker-build) use — the Dockerfile has no
  # default of its own to silently diverge from that pin.
  go-licenses-pin:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.pin.outputs.version }}
      module: ${{ steps.pin.outputs.module }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: rknightion/.github/.github/actions/setup-just@774210034cb603b840df2d136fd3e8fe33469d27 # v1.31.5
      - name: Resolve pinned go-licenses version + module
        id: pin
        run: |
          echo "version=$(just print-go-licenses-version)" >> "$GITHUB_OUTPUT"
          echo "module=$(just print-go-licenses-module)" >> "$GITHUB_OUTPUT"
  geoip-cache:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.probe.outputs.key }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Identify available GeoIP edition
        id: probe
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          previous="$(date -u -d "${month}-01 -1 month" +%Y-%m)"
          # Only a definite 404 establishes absence; timeouts and other statuses
          # cannot safely share an edition cache across runs.
          probe() {
            local edition="$1" product code present=0 missing=0 unknown=0 result
            for product in country asn; do
              if ! code="$(curl -sSLI --max-time 60 -o /dev/null -w '%{http_code}' "https://download.db-ip.com/free/dbip-${product}-lite-${edition}.mmdb.gz")"; then
                unknown=1
              else
                case "$code" in
                  2??) present=$((present + 1)) ;;
                  404) missing=$((missing + 1)) ;;
                  *) unknown=1 ;;
                esac
              fi
            done
            if [ "$unknown" -eq 1 ]; then result=unknown
            elif [ "$present" -eq 2 ]; then result=present
            elif [ "$missing" -eq 2 ]; then result=missing
            else result=mixed
            fi
            printf '%s' "$result"
          }
          current="$(probe "$month")"
          key="inconclusive-${month}-${RUN_ID}-${RUN_ATTEMPT}"
          if [ "$current" = present ]; then
            # GET may still fail after HEAD. A per-run identity lets the Docker
            # fallback work without reusing that fallback on a later probe.
            key="current-${month}-${RUN_ID}-${RUN_ATTEMPT}"
          elif [ "$current" = missing ] && [ "$(probe "$previous")" = present ]; then
            key="previous-${previous}"
          fi
          echo "key=${key}" >> "$GITHUB_OUTPUT"
  image:
    needs: [go-licenses-pin, geoip-cache]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@c1cc41bc7a0ea1d027567f9a7003ae79e35fe870 # v1.31.6 # zizmor: ignore[unpinned-uses]
    with:
      release-tag: ${{ inputs.release_tag }}
      publish-branch-tags-on-prerelease: false
      build-args: |
        GO_LICENSES_VERSION=${{ needs.go-licenses-pin.outputs.version }}
        GO_LICENSES_MODULE=${{ needs.go-licenses-pin.outputs.module }}
        GEOIP_REFRESH=${{ needs.geoip-cache.outputs.key }}
      # Publish charts only for real releases. The pinned shared reusable gives
      # edge charts a 12-character appVersion while its edge image SHA tag is
      # seven characters, so an edge chart would point at a nonexistent image.
      # Release packages override both chart/app versions to the same semver.
      helm-chart-path: ${{ inputs.release_tag != '' && 'charts/opnsense2otel' || '' }}
  notices:
    if: inputs.release_tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: rknightion/.github/.github/actions/setup-just@774210034cb603b840df2d136fd3e8fe33469d27 # v1.31.5
      # Only go-licenses notices here; the shared reusable already generates +
      # attaches the image SPDX+CycloneDX SBOMs (same filenames — don't double-upload).
      - name: Generate + attach third-party notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          just notices
          gh release upload "${RELEASE_TAG}" THIRD_PARTY_NOTICES.md --clobber
