name: Release Please

on:
  push:
    branches: [main]

# One shared group for the whole repo, and NEVER cancel: this workflow derives the
# next version from git tags plus commits and reconciles a single release PR, so two
# runs in flight reach the same answer and then fight over it. Three overlapped on
# 2026-09-05 during a burst of Renovate merges (835fdd51, e467076e, 20eaf345) with all
# three release-please jobs running to completion against the same PR.
#
# Deliberately NOT the same group as the container-publish reusable this workflow
# calls. A parent holding a group while its child waits for that same group is a
# deadlock. The reusable keeps its own group and cancels superseded EDGE builds only
# (`cancel-in-progress: inputs.release-tag == ''`), which is correct and left alone:
# a stale :main manifest is fixed by the next push, and a release publish is never
# cancelled there.
concurrency:
  group: release-please
  cancel-in-progress: false

# Default to read-only; each job requests only the write scopes it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on camden being up, unsealed and on the tailnet; a
      # failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@55296cba29f55339f74b048e186011e866ea6275 # v1.32.0
        with:
          permission-set: release-please-opnsense2otel
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.bao.outputs.token }}

  tool-pins:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    outputs:
      syft: ${{ steps.pin.outputs.syft }}
      goreleaser: ${{ steps.pin.outputs.goreleaser }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: rknightion/.github/.github/actions/setup-just@55296cba29f55339f74b048e186011e866ea6275 # v1.32.0
      - name: Resolve release tool pins
        id: pin
        run: |
          set -euo pipefail
          version_pattern='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*)(\.([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          # Validate raw output before command substitution can strip trailing newlines.
          resolve_pin() {
            just "$1" | jq -Rser --arg pattern "$version_pattern" \
              'if test("\\A" + $pattern + "\\n\\z") then .[0:-1] else error("invalid release tool pin") end'
          }
          syft=$(resolve_pin print-syft-version)
          goreleaser=$(resolve_pin print-goreleaser-version)
          printf 'syft=%s\ngoreleaser=%s\n' "$syft" "$goreleaser" >> "$GITHUB_OUTPUT"

  # Binaries via the shared GoReleaser reusable (cross-compiled binaries + checksums,
  # uploaded to the release-please release). The image is published by the publish job.
  binaries:
    needs: [release-please, tool-pins]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets
      id-token: write
      packages: write
      attestations: write # SLSA build provenance (.intoto.jsonl) attached to the release
    uses: rknightion/.github/.github/workflows/binaries.yml@55296cba29f55339f74b048e186011e866ea6275 # v1.32.0
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      qualify-release-tag: true
      go-version: "1.27.4"
      install-cosign: true # keyless-sign the checksums (see .goreleaser.yml signs:)
      goreleaser-version: ${{ needs.tool-pins.outputs.goreleaser }}
      pre-cmd: "go install github.com/anchore/syft/cmd/syft@${{ needs.tool-pins.outputs.syft }}" # archive SBOMs

  # Build, sign, attest, and publish the container image; attach third-party notices + SBOMs.
  # Delegates image work to the shared reusable; publish.yml generates notices with just notices.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  # A publish job can partially succeed: v3.0.0 proved that the image and binaries
  # may land while notices fail. Read the release back after both publishing arms
  # and fail on any missing mandatory artifact (#436).
  verify-release-assets:
    needs: [release-please, binaries, publish]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Verify mandatory release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mapfile -t actual < <(
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )
          required=(
            THIRD_PARTY_NOTICES.md
            checksums.txt
            checksums.txt.intoto.jsonl
            checksums.txt.sigstore.json
            opnsense2otel.cdx.json
            opnsense2otel.spdx.json
            opnsense2otel_Darwin_arm64.tar.gz
            opnsense2otel_Darwin_arm64.tar.gz.sbom.json
            opnsense2otel_Darwin_x86_64.tar.gz
            opnsense2otel_Darwin_x86_64.tar.gz.sbom.json
            opnsense2otel_Freebsd_arm64.tar.gz
            opnsense2otel_Freebsd_arm64.tar.gz.sbom.json
            opnsense2otel_Freebsd_x86_64.tar.gz
            opnsense2otel_Freebsd_x86_64.tar.gz.sbom.json
            opnsense2otel_Linux_arm64.tar.gz
            opnsense2otel_Linux_arm64.tar.gz.sbom.json
            opnsense2otel_Linux_x86_64.tar.gz
            opnsense2otel_Linux_x86_64.tar.gz.sbom.json
            opnsense2otel_Openbsd_arm64.tar.gz
            opnsense2otel_Openbsd_arm64.tar.gz.sbom.json
            opnsense2otel_Openbsd_x86_64.tar.gz
            opnsense2otel_Openbsd_x86_64.tar.gz.sbom.json
            opnsense2otel_Windows_x86_64.zip
            opnsense2otel_Windows_x86_64.zip.sbom.json
          )
          required+=("opnsense2otel-${RELEASE_VERSION}.tgz")
          missing=()
          for asset in "${required[@]}"; do
            if ! printf '%s\n' "${actual[@]}" | grep -Fqx "$asset"; then
              missing+=("$asset")
            fi
          done
          if ((${#missing[@]})); then
            printf '::error::release %s is missing mandatory asset: %s\n' \
              "$RELEASE_TAG" "${missing[@]}"
            exit 1
          fi
          printf 'verified %d mandatory assets on %s\n' "${#required[@]}" "$RELEASE_TAG"

  # Edge build on every non-release push to main: publishes the :main multi-arch image
  # (replaces the removed docker-build-main job). release_created gates this vs the
  # release publish above, so the two never both run on one push.
  # Production (Watchtower on camden) tracks :main, so every edge publish restarts the
  # exporter and drops its in-flight log records. Skip it for commits that change no
  # shipped input, using the same rule auto-rc.yml applies to release candidates.
  edge-shipped-change:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read # look up the last successful workflow run
    outputs:
      shipped: ${{ steps.paths.outputs.shipped }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history, so the whole push range (before..sha) can be diffed.
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A cancelled intervening run may have contained a shipped change.
          if ! successful=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-please.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty'); then
            echo '::warning::Could not look up the last successful release-please run' >&2
            successful=''
          fi
          base=$(scripts/edge-diff-base.sh "$HEAD_SHA" "$BEFORE_SHA" "$successful")
          shipped=$(scripts/shipped-change.sh "$HEAD_SHA" "$base")
          echo "shipped=${shipped}" >> "${GITHUB_OUTPUT}"

  edge:
    needs: [release-please, edge-shipped-change]
    if: needs.release-please.outputs.release_created != 'true' && needs.edge-shipped-change.outputs.shipped == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ""
