name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@3ff73bad4b13793668e6ee871f5ee642ddc31060 # v1.30.17
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'