# Automatic release candidates. On every push to main that passes CI, cut
# vX.Y.Z-rc.N against the version release-please is already staging in its open
# release PR, then publish the image, chart and binaries for it.
#
# The stable release path (release-please.yml) is untouched: it still opens and
# maintains the release PR, and a stable release still requires an explicit
# merge. The RC path never writes to the changelog or the release PR.
name: auto-rc

# Fires off CI's completion rather than the push itself. The old `push:` trigger
# started this workflow immediately and then burned a runner slot in
# `rc / wait-for-ci` polling for a CI run still queued behind it — 20.6
# runner-hours of pure polling fleet-wide, and 5 of 17 in-flight jobs at one
# sample. workflow_run fires only once CI has a verdict.
#
# `workflows:` matches the workflow's `name:` field, NOT its filename. If that
# name changes this silently stops firing and RCs stop being cut, with no error.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only push events from this repository pass the job gate below
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel a half-published RC; serialize instead.
  group: auto-rc
  cancel-in-progress: false

jobs:
  shipped-change:
    # workflow_run has no paths filter, so classify the exact commit that CI
    # tested before calling the fleet-wide release workflow. Keep this a
    # positive allowlist: new repository metadata stays release-neutral until
    # it is deliberately identified as an input to a shipped artifact.
    # `branches: [main]` above matches the triggering run's head branch NAME,
    # so a fork pull request from a branch called `main` also matches it, and
    # CI runs on pull requests. Without the event and repository checks a green
    # fork PR would reach the RC path with write access.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      shipped: ${{ steps.paths.outputs.shipped }}
    steps:

      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        # The allowlist and the pin-bump exemption live in the script so the
        # edge build in release-please.yml applies exactly the same rule.
        run: |
          shipped=$(scripts/shipped-change.sh "${HEAD_SHA}")
          echo "shipped=${shipped}" >> "${GITHUB_OUTPUT}"

  # Validate the exact tested commit before the tagger can create a prerelease.
  # Older in-flight CI runs lack the recipes and fail here without creating a tag.
  tool-pins-preflight:
    needs: shipped-change
    if: needs.shipped-change.outputs.shipped == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: rknightion/.github/.github/actions/setup-just@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0
      - name: Preflight release tool pins
        run: |
          set -euo pipefail
          version_pattern='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*)(\.([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          # Validate raw output before command substitution can strip trailing newlines.
          resolve_pin() {
            just "$1" | jq -Rser --arg pattern "$version_pattern" \
              'if test("\\A" + $pattern + "\\n\\z") then .[0:-1] else error("invalid release tool pin") end'
          }
          resolve_pin print-syft-version >/dev/null
          resolve_pin print-goreleaser-version >/dev/null

  rc:
    # shipped-change itself runs only after green CI; this second gate prevents
    # release-neutral commits from reaching the shared RC workflow.
    needs: [shipped-change, tool-pins-preflight]
    if: needs.shipped-change.outputs.shipped == 'true' && needs.tool-pins-preflight.result == 'success'
    permissions:
      contents: write      # create the RC tag and the GitHub prerelease
      pull-requests: read  # find the open release-please PR
      checks: read         # poll ci-success for this commit
    uses: rknightion/.github/.github/workflows/auto-rc.yml@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0
    with:
      # Under workflow_run, github.sha is the DEFAULT BRANCH HEAD, not the
      # commit CI ran on — it races ahead on rapid pushes. head_sha is the
      # commit the triggering run actually tested.
      sha: ${{ github.event.workflow_run.head_sha }}
      image-ref: ghcr.io/rknightion/opnsense2otel

  # Same image + chart path a stable release takes, just with an RC tag.
  # container-publish suppresses `latest` for any tag containing '-', so an RC
  # can never steal Latest from a stable release.
  publish:
    needs: rc
    if: needs.rc.outputs.tag != ''
    permissions:
      contents: write        # attach SBOMs + notices to the RC release
      packages: write        # push the image and chart to GHCR
      id-token: write        # cosign keyless signing
      attestations: write    # SLSA build provenance
      security-events: write # Trivy SARIF upload
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.rc.outputs.tag }}

  tool-pins:
    needs: rc
    if: needs.rc.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      syft: ${{ steps.pin.outputs.syft }}
      goreleaser: ${{ steps.pin.outputs.goreleaser }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.rc.outputs.tag }}
          persist-credentials: false
      - uses: rknightion/.github/.github/actions/setup-just@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0
      - name: Resolve release tool pins
        id: pin
        run: |
          set -euo pipefail
          version_pattern='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*)(\.([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          # Validate raw output before command substitution can strip trailing newlines.
          resolve_pin() {
            just "$1" | jq -Rser --arg pattern "$version_pattern" \
              'if test("\\A" + $pattern + "\\n\\z") then .[0:-1] else error("invalid release tool pin") end'
          }
          syft=$(resolve_pin print-syft-version)
          goreleaser=$(resolve_pin print-goreleaser-version)
          printf 'syft=%s\ngoreleaser=%s\n' "$syft" "$goreleaser" >> "$GITHUB_OUTPUT"

  # goreleaser-args and pre-cmd are copied VERBATIM from release-please.yml's
  # binaries job (tag reference adapted to this workflow's `rc` job output).
  binaries:
    needs: [rc, tool-pins]
    if: needs.rc.outputs.tag != ''
    permissions:
      contents: write     # upload binaries + checksums to the RC release
      id-token: write     # cosign keyless signing
      packages: write     # goreleaser reads the registry for existing artifacts
      attestations: write # SLSA build provenance on the archives
    uses: rknightion/.github/.github/workflows/binaries.yml@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0
    with:
      release-tag: ${{ needs.rc.outputs.tag }}
      qualify-release-tag: true
      go-version: "1.27.4"
      install-cosign: true
      goreleaser-version: ${{ needs.tool-pins.outputs.goreleaser }}
      pre-cmd: "go install github.com/anchore/syft/cmd/syft@${{ needs.tool-pins.outputs.syft }}" # archive SBOMs
