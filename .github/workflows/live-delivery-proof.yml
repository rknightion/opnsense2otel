name: OPNsense Live Delivery Proof

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-delivery-proof
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'rknightion/opnsense2otel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tailnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: rknightion/.github/.github/actions/setup-just@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Build dispatched tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          just build-live-proof "$RUNNER_TEMP/opnsense2otel" "$RUNNER_TEMP/configredactionverify"

      - name: Prove read-only configuration delivery
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_API_KEY: ${{ secrets.DEVBOX_API_KEY }}
          DEVBOX_API_SECRET: ${{ secrets.DEVBOX_API_SECRET }}
          GRAFANA_OTLP_USER: ${{ secrets.GRAFANA_OTLP_USER }}
          GRAFANA_LOKI_USER: ${{ secrets.GRAFANA_LOKI_USER }}
          GRAFANA_CAP_TOKEN: ${{ secrets.GRAFANA_CAP_TOKEN }}
        run: |
          set -euo pipefail
          just live-delivery-proof "$RUNNER_TEMP/opnsense2otel" "$RUNNER_TEMP/configredactionverify" | tee -a "$GITHUB_STEP_SUMMARY"
