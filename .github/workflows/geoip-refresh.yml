name: geoip-refresh

# Refresh the DB-IP Lite databases bundled in the image (#549).
#
# The databases are fetched by the Dockerfile at image build time and are NOT in
# git, so "refresh the data" and "rebuild the image" are the same act — this
# workflow just republishes the edge :main image once DB-IP has published the new
# month. Nothing is committed and nothing is mutated in the repository.
#
# Why a rebuild rather than a job that commits the new files:
#   * The files are ~17.8 MB of binary republished monthly. Committing them would
#     grow this repository's history by that much every month, permanently and
#     irreversibly — which is the whole reason they are fetched at build time.
#   * A rebuild cannot lie. The image's data is, by construction, what its own
#     build fetched; there is no second copy in git to drift out of step with it.
#   * Every release build already re-fetches, so tagged images get current data
#     without this workflow existing at all. This only keeps :main current between
#     releases.
#
# DB-IP publishes on the 1st of the month; this runs on the 3rd so a publish that
# lags UTC midnight has landed. (The Dockerfile independently falls back to the
# previous month, so an early or manual build is never a red build — see its
# fetch loop.)
on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Only rebuild when there is genuinely new data. Without this the run would
  # rebuild and republish :main on the previous month's files, which costs a
  # pointless image push and, worse, makes the refresh look like it worked.
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      available: ${{ steps.probe.outputs.available }}
      month: ${{ steps.probe.outputs.month }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Probe DB-IP for this month's Lite databases
        id: probe
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          available=true
          for product in country asn; do
            url="https://download.db-ip.com/free/dbip-${product}-lite-${month}.mmdb.gz"
            if status="$(curl -sSLI --max-time 60 -o /dev/null -w '%{http_code}' "$url")" && [ "$status" = 200 ]; then
              echo "present: ${url}"
            else
              echo "::notice::${url} is not published yet — skipping this refresh"
              available=false
            fi
          done
          echo "month=${month}" >> "$GITHUB_OUTPUT"
          echo "available=${available}" >> "$GITHUB_OUTPUT"

  # Same call the edge build in release-please.yml makes: release_tag "" publishes
  # the multi-arch :main image, whose build re-fetches the databases.
  rebuild:
    needs: check
    if: needs.check.outputs.available == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ""

  verify:
    needs: [check, rebuild]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Verify the published attribution edition
        env:
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MONTH: ${{ needs.check.outputs.month }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          scratch="$(mktemp -d)"
          export DOCKER_CONFIG="$scratch/docker"
          container=""
          cleanup() {
            status=$?
            trap - EXIT
            if [ -n "$container" ]; then docker rm -f "$container" >/dev/null || status=1; fi
            rm -rf "$scratch" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          mkdir "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          resolve_main() {
            docker buildx imagetools inspect "$image:main" --format '{{json .Manifest}}' |
              jq -er '.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))'
          }
          digest="$(resolve_main)"
          invocation="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          gh attestation verify "oci://${image}@${digest}" --repo "$REPOSITORY" \
            --signer-workflow rknightion/.github/.github/workflows/container-publish.yml \
            --signer-digest ac54996b4cf19e6ef58b02754903610c77f0383f \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --format json > "$scratch/verified.json"
          jq -e --arg invocation "$invocation" --arg digest "${digest#sha256:}" --arg image "$image" '
            any(.[].verificationResult.statement;
              .predicate.runDetails.metadata.invocationId == $invocation and
              any(.subject[]; (.name | ascii_downcase) == $image and .digest.sha256 == $digest))
          ' "$scratch/verified.json" >/dev/null
          # Hash the raw response before parsing: Buildx does not check it against
          # the requested digest. Never normalize whitespace in an OCI manifest.
          docker buildx imagetools inspect "$image@$digest" --raw > "$scratch/index.json"
          printf '%s  %s\n' "${digest#sha256:}" "$scratch/index.json" | sha256sum --check --status || {
            echo '::error::Index bytes do not match the attested digest'
            exit 1
          }
          for arch in amd64 arm64; do
            child="$(jq -er --arg arch "$arch" '
              [.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch)] |
              if length == 1 then .[0].digest | strings | select(test("^sha256:[0-9a-f]{64}$"))
              else error("expected exactly one Linux image for " + $arch) end
            ' "$scratch/index.json")"
            docker pull --platform "linux/$arch" "$image@$child"
            container="$(docker create --platform "linux/$arch" "$image@$child")"
            docker cp "$container:/licenses/GEOIP-DB-IP-ATTRIBUTION.txt" "$scratch/attribution"
            edition="$(grep '^  Edition: ' "$scratch/attribution")"
            if [ "$edition" != "  Edition: $EXPECTED_MONTH" ]; then
              echo "::error::Published $arch attribution edition does not match $EXPECTED_MONTH"
              exit 1
            fi
            docker rm -f "$container" >/dev/null
            container=""
          done
          [ "$(resolve_main)" = "$digest" ] || { echo '::error::main moved during verification'; exit 1; }
          echo "Published attribution matches $EXPECTED_MONTH for $digest"
