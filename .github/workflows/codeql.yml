name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@072f91d24bad803b1cd08579924e7b8cc073f903 # v1.25.18
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'