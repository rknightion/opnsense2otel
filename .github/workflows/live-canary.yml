name: OPNsense Live-Box Canary

# The live half of the API drift detection (#195): joins the tailnet, probes
# every endpoint on the development-channel OPNsense box, validates the payload
# STRUCTURE against schemas derived from our response structs (cmd/apidrift),
# then runs the actual exporter end-to-end and asserts collector success plus a
# metric-name floor. Drift lands in the same api-drift issue machinery as the
# endpoint-manifest canary (api-contract.yml), under its own issue title.
#
# Runs once per probe target (nightly = devel-channel box, release-vm =
# release-channel box), each filing into its OWN issue so neither can close the
# other's findings. camden runs the third target, prod, on a systemd timer.
#
# Reports and logs carry key paths + JSON type names only — never payload
# values (the box's data must not leak into a public repo).

# DISPATCH ONLY, and ON DEMAND. The testbed is off by default. When a change
# needs live validation, the main session raises the lab on `oli`
# (opnsense-testbed-power.sh up <hold>), dispatches this workflow, then releases
# the hold and takes the lab down. oli's opnsense-testbed-up.timer and
# opnsense-testbed-canary.timer, which used to do this every morning, are
# deliberately disabled; do not re-enable them.
#
# This used to carry `cron: '47 6 * * *'`, sized against the 06:00-08:30 UTC
# testbed power window #625 introduced. GitHub does not run scheduled workflows
# at the requested time: every scheduled run from 2026-08-02 to 2026-08-05 started
# between 08:55 and 10:26 UTC — 2h08 to 3h39 late — so the runner dialled boxes
# that were already shut down and the canary failed four days running with
# `pre-flight probe failed - box unreachable`. Scheduled runs are documented as
# best-effort with no upper bound on the delay, so there is no cron time that fixes
# it and no window width short of most of the day, which is the cost #625 exists to
# avoid.
#
# Do NOT add a `schedule:` back: it would fire against a lab nobody raised, or
# race an on-demand run, and report either as drift.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-canary
  cancel-in-progress: false

env:
  # Distinct floors so a partial outage is distinguishable from drift:
  # every enabled sub-collector must succeed (the smoke waits for /-/ready, i.e.
  # for the poll scheduler to have polled all of them once); the box emits 622
  # catalogue metric names on the last recorded clean run and 641 on a warm local
  # run against it (2026-07-21) — the count grew with the collectors added since the
  # 495-name figure this floor was first written against. Floor keeps ~10% of
  # headroom for box-state variance (a plugin off, an empty lease table).
  METRIC_NAME_FLOOR: '560'

jobs:
  canary:
    # One job per probe target. Each owns its OWN drift issue (title suffixed
    # with the target) rather than sharing one, because the close-on-clean step
    # below cannot tell whose findings an issue holds: with a shared issue, a
    # clean run on one box closes an issue holding another box's real drift and
    # comments "clean" over it. Separate titles make that structurally
    # impossible instead of guarded against.
    strategy:
      # Never cancel the sibling target because one box is down or drifting -
      # the whole point is reading the two generations against each other.
      fail-fast: false
      # ONE AT A TIME. The lab is a single physical resource and each job now
      # raises and lowers it, so two in parallel would have one calling `down`
      # while the other is mid-probe. The power script's flock would refuse the
      # loser rather than corrupt anything, but a refused teardown still leaves
      # the lab up, so serialise here instead of relying on the lock.
      #
      # Each job owns a complete cycle rather than sharing one raise. That costs
      # a second boot, about three minutes, and buys a job that is correct on
      # its own: if the first dies, the watchdog reclaims the lab and the second
      # raises it fresh with no shared state to get out of step.
      max-parallel: 1
      matrix:
        include:
          - target: nightly
            host_secret: DEVBOX_HOST
            key_secret: DEVBOX_API_KEY
            secret_secret: DEVBOX_API_SECRET
          - target: release-vm
            host_secret: DEVBOX2_HOST
            key_secret: DEVBOX2_API_KEY
            secret_secret: DEVBOX2_API_SECRET
    # Hardening, since this workflow holds tailnet credentials in a public
    # repo: it triggers only on schedule + manual dispatch (never on
    # pull_request, so fork PRs can neither run it nor see its secrets), the
    # secrets live in the `tailnet` environment whose deployment-branch policy
    # is main-only, and the repository guard stops forks' copies from even
    # attempting scheduled runs. timeout-minutes bounds how long the ephemeral
    # node can exist if something hangs.
    if: github.repository == 'rknightion/opnsense2otel'
    name: canary (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tailnet
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # The tailnet overrides DNS to a private resolver tag:ci cannot reach,
          # which kills api.github.com resolution after the join. The box is
          # dialled by raw tailnet IP, so MagicDNS is not needed here.
          args: --accept-dns=false

      - name: Raise the lab
        id: raise
        env:
          OLI_HOST: ${{ secrets.OLI_TESTBED_HOST }}
          # Sized to one target's cycle: boot, update, probe, smoke. The hold is
          # what stops the scheduled down reclaiming the lab underneath a
          # running job, and it lapses on its own if this job dies.
          LAB_HOLD_SECONDS: '3600'
        run: |
          set -euo pipefail
          # NO KEY, DELIBERATELY. Tailscale SSH terminates :22 on oli and
          # authenticates this runner by its tailnet identity as tag:ci, so
          # there is no private key to mint, store or rotate. The tailnet policy
          # pins tag:ci to the opn-ci account on tag:testbed-power, and that
          # account's login shell allows four verbs and refuses everything
          # else, including an interactive session.
          #
          # Dialled by IP because the join above sets --accept-dns=false, so
          # MagicDNS names do not resolve here.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "opn-ci@${OLI_HOST}" "up ${LAB_HOLD_SECONDS}"

      - name: Bring both firewalls to their channel heads
        env:
          OLI_HOST: ${{ secrets.OLI_TESTBED_HOST }}
        run: |
          set -euo pipefail
          # Currency is a property of the run, not of a timer. Both boxes sat 54
          # and 56 days stale under the old arrangement because nothing ever
          # pulled, and nothing in the canary output could have revealed it.
          #
          # A non-zero exit here is NEVER drift: the power script reserves 3, 4,
          # 5 and 6 for update outcomes precisely so they cannot be confused
          # with apidrift's 1 and 2. Probe anyway - a stale box's payloads are
          # still worth checking, and the generation stamp on the report says
          # which build it actually was.
          if ! ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "opn-ci@${OLI_HOST}" update; then
            echo "::warning::Firmware update did not confirm both boxes at their channel heads; probing anyway" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Schema canary (apidrift)
        id: drift
        env:
          DEVBOX_HOST: ${{ secrets[matrix.host_secret] }}
          OPN2OTEL_OPS_API_KEY: ${{ secrets[matrix.key_secret] }}
          OPN2OTEL_OPS_API_SECRET: ${{ secrets[matrix.secret_secret] }}
          CANARY_PROFILE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Exit 0 = clean or warnings-only; exit 1 = breaking drift (outputs
          # are written first); anything else = probe error.
          if go run ./cmd/apidrift --base-url "https://${DEVBOX_HOST}" --insecure \
               --profile "${CANARY_PROFILE}" \
               --out out/report.md --captures "$RUNNER_TEMP/captures"; then
            :
          else
            code=$?
            if [ "$code" -ne 1 ]; then
              echo "apidrift failed with code $code" >&2
              exit "$code"
            fi
          fi
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end exporter smoke
        id: smoke
        env:
          DEVBOX_HOST: ${{ secrets[matrix.host_secret] }}
          OPN2OTEL_OPS_API_KEY: ${{ secrets[matrix.key_secret] }}
          OPN2OTEL_OPS_API_SECRET: ${{ secrets[matrix.secret_secret] }}
          OPN2OTEL_OPS_PROTOCOL: https
          OPN2OTEL_OPS_INSECURE: 'true'
          OPN2OTEL_INSTANCE_LABEL: canary
        run: |
          set -euo pipefail
          go build -o /tmp/opnsense2otel .
          OPN2OTEL_OPS_API="$DEVBOX_HOST" /tmp/opnsense2otel \
            --exporter.enable-arp-details \
            --exporter.enable-ndp-details \
            --exporter.enable-unbound-infra \
            --exporter.enable-openvpn-details \
            --exporter.enable-firmware-package-details \
            --exporter.enable-dnsmasq-details \
            --exporter.enable-firewall-rules-details \
            --exporter.enable-kea-details \
            --exporter.enable-network-diagnostics \
            --exporter.enable-netflow \
            --exporter.enable-dhcpv4-details \
            --exporter.enable-dhcpv6-details \
            --exporter.enable-smart \
            --exporter.enable-tailscale-peer-details \
            --exporter.enable-alias-details \
            --exporter.enable-hasync &
          EXPORTER_PID=$!
          trap 'kill "$EXPORTER_PID" 2>/dev/null || true' EXIT

          # Wait for the poll scheduler to warm up (#341). Since #336 a scrape
          # replays the snapshot the per-collector pollers fill, so scraping a
          # few seconds after start reports only the handful of collectors that
          # have polled so far — which is what made this smoke read 24 of 47
          # collectors and 170 of ~495 metric names. /-/ready turns 200 only once
          # the health poll AND every collector have completed a first poll, so it
          # is the correct gate; readiness results are cached for 10s, hence the
          # 5s poll and the generous ceiling.
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -m 10 -o /dev/null http://localhost:8080/-/ready; then
              ready=1
              break
            fi
            sleep 5
          done
          # Serving is a pure memory read now, so the scrape itself is fast; the
          # retries only cover the (already-ready) listener being momentarily busy.
          curl -sf -m 60 --retry 5 --retry-delay 5 --retry-connrefused \
            -o /tmp/metrics.txt http://localhost:8080/metrics

          fail=0
          # shellcheck disable=SC2016 # single-quoted $1/$2 are awk field refs, not shell vars
          {
            echo ""
            echo "## End-to-end exporter smoke"
            echo ""
            if [ "$ready" = 1 ]; then
              echo "- exporter reached \`/-/ready\` (poll scheduler warm) ✅"
            else
              echo "- exporter never reached \`/-/ready\` within 300s — the assertions below ran against a partial snapshot ❌"
              fail=1
            fi
            up=$(awk '$1 ~ /^opnsense_up\{/ { print $2 }' /tmp/metrics.txt | head -n1)
            if [ "$up" = "1" ]; then
              echo "- \`opnsense_up\` = 1 ✅"
            else
              echo "- \`opnsense_up\` = ${up:-absent} ❌"
              fail=1
            fi
            failed_collectors=$(awk '$1 ~ /^opnsense_exporter_scrape_collector_success\{/ && $2 == 0 { print $1 }' /tmp/metrics.txt || true)
            ok_collectors=$(awk '$1 ~ /^opnsense_exporter_scrape_collector_success\{/ && $2 == 1 { c++ } END { print c+0 }' /tmp/metrics.txt)
            if [ -z "$failed_collectors" ] && [ "$ok_collectors" -gt 0 ]; then
              echo "- all ${ok_collectors} sub-collectors succeeded ✅"
            else
              echo "- failed sub-collectors ❌:"
              # Label sets only — no payload values.
              echo "$failed_collectors" | sed 's/^/  - `/; s/$/`/'
              fail=1
            fi
            names=$(grep -c '^# TYPE opnsense_' /tmp/metrics.txt || true)
            if [ "$names" -ge "$METRIC_NAME_FLOOR" ]; then
              echo "- ${names} distinct \`opnsense_*\` metric names (floor ${METRIC_NAME_FLOOR}) ✅"
            else
              echo "- only ${names} distinct \`opnsense_*\` metric names (floor ${METRIC_NAME_FLOOR}) ❌"
              fail=1
            fi
          } >> out/report.md
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$fail" >> "$GITHUB_OUTPUT"

          # A digest of WHICH smoke assertions failed, for the quiet-canary
          # comparison (OPN-0112). A bare pass/fail flag is not enough: if
          # collector A fails on one run and collector B on the next, the flag
          # reads 1 both times and the change would land in silence — the exact
          # class of miss this whole mechanism exists to prevent.
          #
          # Assertion VERDICTS and failed-collector IDENTITIES only. The
          # ok_collectors and metric-name counts are deliberately excluded:
          # they wobble with any collector change and would re-post a 200-line
          # report because one metric name appeared.
          smoke_fp=$(
            {
              echo "ready=${ready}"
              echo "up=${up:-absent}"
              echo "names_above_floor=$([ "$names" -ge "$METRIC_NAME_FLOOR" ] && echo 1 || echo 0)"
              echo "$failed_collectors" | sort
            } | sha256sum | cut -c1-16
          )
          echo "smoke_fingerprint=$smoke_fp" >> "$GITHUB_OUTPUT"
          # Job failure is decided after the issue steps, so a smoke failure
          # still files/updates the drift issue first.

      - name: Ensure api-drift label exists
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create api-drift --color B60205 \
            --description "OPNsense API contract drift detected by CI" 2>/dev/null || true

      - name: Open or update drift issue
        if: steps.drift.outputs.drift == 'true' || steps.drift.outputs.warnings == 'true' || steps.smoke.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TARGET: ${{ matrix.target }}
          DRIFT_FINGERPRINT: ${{ steps.drift.outputs.fingerprint }}
          SMOKE_FINGERPRINT: ${{ steps.smoke.outputs.smoke_fingerprint }}
          # Days of silence before a heartbeat, so a canary that STOPPED running
          # is distinguishable from one that keeps finding nothing. Without it,
          # "quiet" and "dead" look identical (OPN-0112).
          HEARTBEAT_DAYS: '7'
        run: |
          set -euo pipefail
          # ONE ISSUE PER TARGET. The close step below has no way to tell which
          # target's findings an issue holds, so a shared issue means a clean run
          # on one box closes another box's live drift and comments "clean" over
          # it — a canary reporting all-clear while real drift sits unread.
          title="OPNsense live-box canary drift - ${CANARY_TARGET}"
          # Label+exact-title dedupe — same proven pattern as api-contract.yml
          # (author-based matching broke on gh's bot-login shape changes, #83).
          existing=$(gh issue list --label api-drift --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -n1)

          # The comparison key is apidrift's findings digest PLUS the smoke
          # verdict, which apidrift cannot know because the smoke runs after it.
          # parseFingerprintMarker takes the LAST marker in a body, so appending
          # this one lets it win over the digest-only marker apidrift wrote.
          combined="${DRIFT_FINGERPRINT}-smoke${SMOKE_FINGERPRINT}"
          printf '\n<!-- canary-fingerprint: %s -->\n' "$combined" >> out/report.md

          if [ -z "$existing" ]; then
            gh issue create --title "$title" --label api-drift --body-file out/report.md
            exit 0
          fi

          # THE BASELINE IS THE LAST FULL REPORT, NOT THE LAST COMMENT. A
          # heartbeat carries canary-heartbeat and no fingerprint, so it can
          # never become the baseline — if it could, every heartbeat would make
          # the next run re-post the whole report and the noise would return.
          # The issue BODY counts too: the first report is the body, not a
          # comment.
          body_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${existing}" \
            --jq '[{body: .body, at: .created_at}]')
          # `gh api --paginate --jq` emits one JSON document PER PAGE, so an
          # array filter over two pages yields `[...][...]` — not valid JSON,
          # and --argjson below would reject it. These issues accumulate a
          # comment per run by design and GitHub pages at 30, so this breaks in
          # normal use, not at some theoretical limit. Emit one object per line
          # and slurp the lot into a single array instead.
          comments_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" \
            --paginate --jq '.[] | {body: .body, at: .created_at}' | jq -s '.')
          history=$(jq -n --argjson a "$body_json" --argjson b "$comments_json" '($a + $b)')

          last_fp=$(jq -r '
            map(select(.body != null and (.body | test("<!-- canary-fingerprint: "))))
            | last // {}
            | (.body // "" | [scan("<!-- canary-fingerprint: ([^ ]+) -->")] | last | .[0]? // "")
          ' <<<"$history")
          # Any canary utterance resets the heartbeat clock, report or heartbeat.
          last_said=$(jq -r '
            map(select(.body != null and (.body | test("<!-- canary-(fingerprint: |heartbeat)"))))
            | last // {} | .at // ""
          ' <<<"$history")

          if [ "$last_fp" != "$combined" ]; then
            gh issue comment "$existing" --body-file out/report.md
            exit 0
          fi

          # Same findings, same generation, same smoke verdict as the last full
          # report. Say nothing unless the silence has gone on long enough that
          # it stops being evidence the canary is alive.
          quiet_days=99999
          if [ -n "$last_said" ]; then
            quiet_days=$(( ( $(date -u +%s) - $(date -u -d "$last_said" +%s) ) / 86400 ))
          fi
          if [ "$quiet_days" -ge "$HEARTBEAT_DAYS" ]; then
            gh issue comment "$existing" --body "$(printf '%s\n\n%s\n' \
              "Live-box canary still running on \`${CANARY_TARGET}\`. Findings and generation unchanged for ${quiet_days} days — see the last full report above for what they are." \
              '<!-- canary-heartbeat -->')"
          else
            echo "Findings unchanged (${combined}) and last spoke ${quiet_days}d ago; staying quiet." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close drift issue when clean
        # Any clean run closes the issue — scheduled or manually dispatched;
        # both exercise the identical validation against the same box.
        if: steps.drift.outputs.drift == 'false' && steps.drift.outputs.warnings == 'false' && steps.smoke.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Only ever closes THIS target's issue. A sibling target's drift is a
          # different issue and is none of this job's business.
          title="OPNsense live-box canary drift - ${CANARY_TARGET}"
          existing=$(gh issue list --label api-drift --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Live-box canary clean on the latest ${CANARY_TARGET} run. Closing."
            gh issue close "$existing"
          fi

      - name: Lower the lab
        # ALWAYS, and this is what makes CI-owned power honest: a job that fails
        # or is cancelled mid-probe must not leave six guests running.
        # if: always() covers failure and cancellation; the hold plus the
        # scheduled down cover what this step never reaches at all, such as a
        # lost runner.
        #
        # UNCONDITIONAL, and the guard that used to be here was wrong. Keying
        # on steps.raise.outcome skips teardown exactly when it matters most:
        # if the raise brought the lab up and THEN the ssh call timed out or the
        # connection dropped, the step reads as failed while six guests are
        # running, and nothing would take them down until the watchdog noticed.
        #
        # Running it when the lab was never raised costs one failed ssh, which
        # is harmless and visible. Skipping it when the lab IS up is not.
        if: always()
        env:
          OLI_HOST: ${{ secrets.OLI_TESTBED_HOST }}
        run: |
          set -euo pipefail
          # The wrapper releases CI's own hold before powering down - `down`
          # refuses while a hold is live, and CI is the holder.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "opn-ci@${OLI_HOST}" down

      - name: Fail the job on drift or smoke failure
        if: steps.drift.outputs.drift == 'true' || steps.smoke.outputs.failed == '1'
        run: |
          echo "Live-box drift or smoke failure (see the run summary / the api-drift issue)." >&2
          exit 1
